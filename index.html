<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastTrack Auth & Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    #app-root {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
    }

    /* Auth Cards */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .card-header h2 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .form-group input, .form-group select {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .field-hint {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0f172a;
      margin-top: 0.5rem;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-small {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      background: #334155;
      color: var(--text);
    }

    /* Alerts */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }

    .card-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    .quick-credentials {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--card-border);
      text-align: left;
      font-size: 0.75rem;
      line-height: 1.5;
    }

    .quick-credentials code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--primary);
    }

    /* Dashboards */
    .dashboard-container {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .user-email-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .idle-timer-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .countdown-highlight {
      font-weight: 700;
      color: var(--primary);
    }

    .countdown-warning {
      color: var(--danger) !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .session-notice {
      background: #0f172a;
      border-left: 4px solid var(--accent);
      padding: 0.75rem 1rem;
      margin: 1.5rem 0;
      border-radius: 0 6px 6px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.25rem;
    }

    .metric-card h3 {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
    }

    .metric-status {
      font-size: 1rem;
      font-weight: 600;
    }

    .table-section {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .data-table th, .data-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .data-table th {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-staff {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #f59e0b;
    }

    .badge-customer {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .badge-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .text-success { color: var(--success); }
    .text-accent { color: var(--accent); }
    .font-mono { font-family: monospace; }
    .hidden { display: none !important; }

    .loading-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-root">
    <!-- Rendered dynamically by Vanilla JS Components -->
  </div>

  <!-- Vanilla JS Page Components -->
  <script src="/pages/auth/signIn.js"></script>
  <script src="/pages/auth/signUp.js"></script>
  <script src="/pages/dahsboard/staff.js"></script>
  <script src="/pages/dahsboard/customer.js"></script>
  <script src="/pages/ocrService.js"></script>

  <!-- Main Router & Idle Tracker -->
  <script src="/index.js"></script>
</body>
</html>
